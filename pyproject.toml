[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yanki"
version = "0.1.0"
description = "YAML to Anki converter and printable flashcard generator"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "genanki>=0.13.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "weasyprint>=69.0",
]

[project.scripts]
yanki = "yanki.__main__:main"

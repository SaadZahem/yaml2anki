[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yaml2anki"
version = "0.1.2"
description = "YAML to Anki converter and printable flashcard generator"
keywords = ["anki", "flashcards", "yaml", "pdf", "print", "weasyprint"]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "genanki>=0.13.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "weasyprint>=69.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]

[project.urls]
Homepage = "https://github.com/SaadZahem/yaml2anki"
Documentation = "https://github.com/SaadZahem/yaml2anki#readme"
Repository = "https://github.com/SaadZahem/yaml2anki.git"
Issues = "https://github.com/SaadZahem/yaml2anki/issues"

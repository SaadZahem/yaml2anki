<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="print_styles.css">
    <style> $custom_css </style>
</head>

<body>
    <!-- Front Side Page -->
    <div class="page-header">
        <div class="page-title">${deck_name} &mdash; Front Side (Questions)</div>
        <div class="page-subtitle">
            Print side 1 &bull; Cut along dashed borders
        </div>
    </div>

    <table class="grid">
        ${front_rows}
    </table>

    <div class="page-break"></div>

    <!-- Back Side Page (Horizontally mirrored for perfect duplex double-sided printing) -->
    <div class="page-header">
        <div class="page-title">${deck_name} &mdash; Back Side (Answers)</div>
        <div class="page-subtitle">
            Print side 2 (Duplex short-edge flip) &bull; Cards aligned with front
        </div>
    </div>

    <table class="grid">
        ${back_rows}
    </table>
</body>

</html>
